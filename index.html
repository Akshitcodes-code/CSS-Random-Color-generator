<head>

	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Random Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

				<div id="main-color-heading"></div>

			</div>
			<div id="lower-half">

			</div>
		</div>
	</div>
	<script src="app.js"></script>
